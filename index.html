<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ホーローシンク色替えツール v4</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
  --bg:#f5f3ef; --panel:#fff; --ink:#222; --muted:#666; --line:#d8d3ca;
  --accent:#2f4f6f; --admin:#7c3aed; --viewer:#2563eb;
}
body {
  margin:0; background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
  color:var(--ink);
}
header { padding:18px 24px; border-bottom:1px solid var(--line); background:#fff; }
h1 { margin:0 0 4px; font-size:20px; }
.badge { display:inline-block; color:#fff; font-size:12px; padding:4px 8px; border-radius:999px; margin-left:8px; vertical-align:middle; }
.adminBadge { background:var(--admin); }
.viewerBadge { background:var(--viewer); }
.note { margin:0; color:var(--muted); font-size:13px; }
main { display:grid; grid-template-columns:350px 1fr; gap:18px; padding:18px; }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:14px; box-shadow:0 4px 16px rgba(0,0,0,.04); }
.controls { padding:16px; }
label { display:block; font-size:13px; color:var(--muted); margin:14px 0 6px; }
select,input[type="color"],button,textarea {
  width:100%; box-sizing:border-box; border:1px solid var(--line); border-radius:10px;
  padding:10px 12px; background:#fff; font-size:14px;
}
input[type="color"] { height:44px; padding:4px; }
button { margin-top:10px; cursor:pointer; font-weight:600; }
button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
button.admin { background:var(--admin); color:#fff; border-color:var(--admin); }
button.viewer { background:var(--viewer); color:#fff; border-color:var(--viewer); }
button.danger { color:#8a2d2d; }
.btnRow { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.stage { padding:16px; min-height:640px; }
.titleRow { display:flex; justify-content:space-between; gap:12px; align-items:center; margin-bottom:12px; }
.combo { font-size:18px; font-weight:700; }
canvas { max-width:100%; background:white; border:1px solid var(--line); border-radius:12px; display:block; }
.grid { margin-top:18px; display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; }
.thumb { background:#fff; border:1px solid var(--line); border-radius:12px; padding:8px; }
.thumb canvas { border:none; border-radius:8px; }
.thumb div { text-align:center; font-size:12px; margin-top:4px; }
.small { font-size:12px; color:var(--muted); line-height:1.55; }
.status { min-height:18px; margin-top:8px; font-size:12px; color:#2f6f45; }
#shareBox { margin-top:10px; min-height:70px; resize:vertical; font-size:12px; }
.swatches { margin-top:14px; display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
.swatch { border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#fff; font-size:11px; }
.chip { height:28px; }
.swatch span { display:block; padding:5px 6px; white-space:nowrap; }
.hidden { display:none !important; }
</style>
</head>
<body>
<header>
  <h1 id="pageTitle">ホーローシンク色替えツール <span id="modeBadge" class="badge"></span></h1>
  <p id="pageNote" class="note"></p>
</header>

<main>
  <section class="panel controls">
    <label>ライン色</label>
    <select id="lineSelect"></select>
    <input id="lineColor" type="color">

    <label>ベース色</label>
    <select id="baseSelect"></select>
    <input id="baseColor" type="color">
    <label>濃色補正</label>
    <input id="darkBoost" type="range" min="0" max="100" value="55" style="width:100%;">
    <div class="small">濃色系（ブラック・ネイビー等）の発色を強めます。</div>

    <label>レンダーモード</label>
    <select id="renderMode">
      <option value="auto">AUTO（推奨）</option>
      <option value="soft">淡色優先</option>
      <option value="strong">濃色優先</option>
    </select>


    <div id="adminTools">
      <button id="saveStateBtn" class="primary">現在の設定を保存</button>
      <button id="makeViewerUrlBtn" class="viewer">共有版URLを作る</button>
      <textarea id="shareBox" placeholder="共有版URLがここに表示されます"></textarea>
      <button id="resetBtn" class="danger">保存状態をリセット</button>
    </div>

    <div class="btnRow">
      <button id="downloadBtn">PNGを書き出し</button>
      <button id="gridBtn">ライン色一覧</button>
    </div>

    <div id="status" class="status"></div>
    <p id="modeHelp" class="small"></p>

    <div class="swatches" id="swatches"></div>
  </section>

  <section class="panel stage">
    <div class="titleRow">
      <div class="combo" id="comboLabel"></div>
      <div class="small">ベース画像：指定ホーローシンク写真</div>
    </div>
    <canvas id="mainCanvas" width="1228" height="1228"></canvas>
    <div id="grid" class="grid"></div>
  </section>
</main>

}

function fillSelect(sel) {
  COLORS.forEach(c => {
    const o = document.createElement("option");

    sel.appendChild(o);
  });

function getColor(no) { return COLORS.find(c => String(c.no) === String(no)) || COLORS[0]; }
function hexToRgb(hex) {
  const s = hex.replace("#","");
  return { r: parseInt(s.slice(0,2),16), g: parseInt(s.slice(2,4),16), b: parseInt(s.slice(4,6),16) };
}
function rgbToHsv(r,g,b) {
  r/=255; g/=255; b/=255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b);
  let h=0, s=max===0 ? 0 : (max-min)/max, v=max, d=max-min;
  if (d!==0) {
    if (max===r) h=((g-b)/d)%6; else if (max===g) h=(b-r)/d+2; else h=(r-g)/d+4;
    h*=60; if(h<0) h+=360;
  }
  return {h,s,v};
}
function blendShade(target, shade, boost=1.0) {
  const t = hexToRgb(target);
  const f = Math.max(0, Math.min(1.25, shade * boost));
  return { r:Math.max(0,Math.min(255,Math.round(t.r*f))), g:Math.max(0,Math.min(255,Math.round(t.g*f))), b:Math.max(0,Math.min(255,Math.round(t.b*f))) };
}

    const y=Math.floor((i/4)/w);

    const r=p[i], g=p[i+1], b=p[i+2];

    const inProductZone=x>0&&x<1228&&y>190&&y<990;
    const notBackground=inProductZone&&!(r>247&&g>247&&b>247);

    if(!notBackground) continue;

    const hsv=rgbToHsv(r,g,b);
    const lum=(0.2126*r+0.7152*g+0.0722*b)/255;

    const isRim=(
      ((hsv.h>205&&hsv.h<270)||(b>r+18&&b>g+8))
      && hsv.s>0.18
      && hsv.v<0.62
    );

    if(isRim){
      const shade=0.55 + lum*0.85;
      const nr=blendShade(lineHex,shade,1.05);
      p[i]=nr.r;
      p[i+1]=nr.g;
      p[i+2]=nr.b;
    } else {

      let mix = 0.72;

      if(renderMode==="soft"){
        mix = 0.68;
      }

      if(renderMode==="strong"){
        mix = 0.92;
      }

      if(renderMode==="auto"){
        if(isDarkBase){
          mix = 0.82 + darkBoost*0.15;
        } else {
          mix = 0.68;
        }
      }

      const shade=0.70 + (lum-0.5)*0.90;

      const nr=blendShade(baseHex,shade,1.0);

      p[i]=Math.round(nr.r*mix + r*(1-mix));
      p[i+1]=Math.round(nr.g*mix + g*(1-mix));
      p[i+2]=Math.round(nr.b*mix + b*(1-mix));

      // deepen dark colors further
      if(isDarkBase){
        const deepen = 1.0 - darkBoost*0.22;
        p[i]   = Math.round(p[i] * deepen);
        p[i+1] = Math.round(p[i+1] * deepen);
        p[i+2] = Math.round(p[i+2] * deepen);
      }
    }
  }

  cx.putImageData(data,0,0);

  const tx=targetCanvas.getContext("2d");
  tx.clearRect(0,0,targetCanvas.width,targetCanvas.height);
  tx.drawImage(c,0,0,targetCanvas.width,targetCanvas.height);
}

function currentState() {
  return { lineNo:lineSelect.value, baseNo:baseSelect.value, lineHex:lineColor.value, baseHex:baseColor.value };
}
function applyState(state) {
  lineSelect.value = state.lineNo || "8";
  baseSelect.value = state.baseNo || "2";
  lineColor.value = state.lineHex || getColor(lineSelect.value).hex;
  baseColor.value = state.baseHex || getColor(baseSelect.value).hex;
}
function encodeState(state) { return btoa(unescape(encodeURIComponent(JSON.stringify(state)))); }
function decodeState(s) { return JSON.parse(decodeURIComponent(escape(atob(s)))); }
function loadState() {
  const s=params.get("s");
  if(s) { try { applyState(decodeState(s)); return; } catch(e) {} }
  if(MODE==="admin") {
    const saved=localStorage.getItem(STORAGE_KEY);
    if(saved) { try { applyState(JSON.parse(saved)); return; } catch(e) {} }
  }
  applyState({lineNo:"8", baseNo:"2", lineHex:getColor(8).hex, baseHex:getColor(2).hex});
}
function saveState() {
  if(MODE==="admin") localStorage.setItem(STORAGE_KEY, JSON.stringify(currentState()));
}
function renderMain() {
  const line=getColor(lineSelect.value), base=getColor(baseSelect.value);
  comboLabel.textContent = "ライン: " + line.no + " / " + line.name + "　｜　ベース: " + base.no + " / " + base.name;
  renderTo(canvas, lineColor.value, baseColor.value, 1);
  saveState();
}
function makeGrid() {
  const grid=document.getElementById("grid");
  grid.innerHTML="";
  COLORS.forEach(c => {
    const box=document.createElement("div");
    box.className="thumb";
    const cv=document.createElement("canvas");
    renderTo(cv, c.hex, baseColor.value, 0.22);
    const cap=document.createElement("div");
    cap.textContent=String(c.no).padStart(2,"0")+" "+c.name;
    box.appendChild(cv); box.appendChild(cap); grid.appendChild(box);
  });
}
function renderSwatches() {
  const sw=document.getElementById("swatches");
  sw.innerHTML="";
  COLORS.forEach(c => {
    const div=document.createElement("div");
    div.className="swatch";
    div.innerHTML='<div class="chip" style="background:'+c.hex+'"></div><span>'+c.no+' '+c.name+'</span>';
    sw.appendChild(div);
  });
}
function makeViewerUrl() {
  const baseUrl=location.href.split("?")[0];
  const url=baseUrl+"?mode=viewer&s="+encodeState(currentState());
  shareBox.value=url;
  shareBox.select();
  try { navigator.clipboard.writeText(url); setStatus("共有版URLをコピーしました"); }
  catch(e) { setStatus("共有版URLを作成しました"); }
}
function setupMode() {
  const badge=document.getElementById("modeBadge");
  const note=document.getElementById("pageNote");
  const help=document.getElementById("modeHelp");
  if(MODE==="viewer") {
    badge.textContent="共有版"; badge.className="badge viewerBadge";
    note.textContent="色の微調整・保存はできません。ライン色とベース色の選択だけ可能です。";
    help.textContent="共有版では、管理者が設定した色を基準に表示します。カラーピッカーは非表示です。";
    document.getElementById("adminTools").classList.add("hidden");
    lineColor.classList.add("hidden");
    baseColor.classList.add("hidden");
  } else {
    badge.textContent="管理者版"; badge.className="badge adminBadge";
    note.textContent="色調整、自動保存、共有版URL作成ができます。";
    help.textContent="管理者版で調整した状態から共有版URLを作ると、仲間は同じ配色で開けます。";
  }
}
fillSelect(lineSelect); fillSelect(baseSelect);
setupMode(); loadState(); renderSwatches();

lineSelect.addEventListener("change", () => { lineColor.value=getColor(lineSelect.value).hex; renderMain(); });
baseSelect.addEventListener("change", () => { baseColor.value=getColor(baseSelect.value).hex; renderMain(); });
lineColor.addEventListener("input", renderMain);
baseColor.addEventListener("input", renderMain);
document.getElementById("darkBoost").addEventListener("input", renderMain);
document.getElementById("renderMode").addEventListener("change", renderMain);
document.getElementById("saveStateBtn").addEventListener("click", () => { saveState(); setStatus("現在の設定を保存しました"); });
document.getElementById("makeViewerUrlBtn").addEventListener("click", makeViewerUrl);
document.getElementById("resetBtn").addEventListener("click", () => {
  localStorage.removeItem(STORAGE_KEY);
  applyState({lineNo:"8", baseNo:"2", lineHex:getColor(8).hex, baseHex:getColor(2).hex});
  renderMain(); setStatus("保存状態をリセットしました");
});
document.getElementById("gridBtn").addEventListener("click", makeGrid);
document.getElementById("downloadBtn").addEventListener("click", () => {
  const a=document.createElement("a");
  a.href=canvas.toDataURL("image/png");
  a.download="horo_sink_line"+lineSelect.value+"_base"+baseSelect.value+".png";
  a.click();
});
img.onload = () => renderMain();
</script>
